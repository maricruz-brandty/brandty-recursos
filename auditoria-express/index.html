  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"es\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Brandty · Auditoría Express — Selección × Valores®<\u002Ftitle>\n<style>/* ============================================================\n   BRANDTY EDITORIAL DARK — global entry point.\n   Consumers link THIS file only. Import order = cascade order.\n   ============================================================ */\n/* ============================================================\n   BRANDTY · WEBFONTS — Jornada Sans (real brand typeface)\n   Weights provided: Book 400 · Medium 500 · Bold 700 · Heavy 800\n   Files in assets/fonts/ (path relative to this file in tokens/).\n   ============================================================ */\n@font-face {\n  font-family: 'Jornada Sans';\n  src: url(\"2ca5a9d1-054d-4a9d-a873-4d33ac7380a2\") format('opentype');\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Jornada Sans';\n  src: url(\"76a4bc3d-694b-4f01-b159-ab1928d1092f\") format('truetype');\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Jornada Sans';\n  src: url(\"79318cb6-0a96-4f48-876c-5ad1a2cb7a96\") format('truetype');\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Jornada Sans';\n  src: url(\"74647e0f-f76b-4fd1-9052-3b993d618a00\") format('truetype');\n  font-weight: 800;\n  font-style: normal;\n  font-display: swap;\n}\n/* Heavy doubles for the 900 slot (no separate Black file shipped). */\n@font-face {\n  font-family: 'Jornada Sans';\n  src: url(\"74647e0f-f76b-4fd1-9052-3b993d618a00\") format('truetype');\n  font-weight: 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   BRANDTY · COLOR TOKENS\n   Boutique tech-recruitment consultancy — editorial dark.\n   Brand spec: Azul #72BACD · Coral #FE8675 · Gris #3C3C3C · Blanco.\n   ============================================================ */\n:root {\n  /* ---- Brand core ---- */\n  --brandty-blue: #72BACD;        /* primary brand — headlines, accents, line art */\n  --brandty-coral: #FE8675;       /* ALERT / single accent only — never decorative */\n  --brandty-gray: #3C3C3C;        /* brand dark gray (logo dot, body on light) */\n  --brandty-white: #FFFFFF;\n\n  /* ---- Blue ramp (derived from brand blue) ---- */\n  --blue-100: #E3F1F5;\n  --blue-200: #BFE0E9;\n  --blue-300: #9BCFDD;\n  --blue-400: #72BACD;            /* = brand blue */\n  --blue-500: #4FA1B7;\n  --blue-600: #3A8194;\n  --blue-700: #2B6373;\n\n  /* ---- Coral ramp ---- */\n  --coral-200: #FFD2CB;\n  --coral-300: #FFAA9D;\n  --coral-400: #FE8675;           /* = brand coral */\n  --coral-500: #E96553;\n  --coral-600: #C84B3B;\n\n  /* ---- Ink scale (editorial dark surfaces) ---- */\n  --ink-900: #141517;            /* deepest scene background */\n  --ink-800: #1C1E20;            /* primary dark surface */\n  --ink-700: #26282A;            /* raised dark surface / card on dark */\n  --ink-600: #3C3C3C;            /* = brand gray */\n  --ink-500: #565658;\n  --ink-400: #7A7B7D;\n  --ink-300: #A6A7A9;\n  --ink-200: #D2D3D5;\n  --ink-100: #ECEDEE;\n  --ink-050: #F6F7F8;\n\n  /* ---- Optional editorial accent (seen in real creatives: highlighted word) ---- */\n  --accent-olive: #C7C24A;       /* sparingly — one highlighted word in a headline */\n\n  /* ============================================================\n     SEMANTIC ALIASES — prefer these in components\n     ============================================================ */\n  /* Surfaces */\n  --surface-scene: var(--ink-900);      /* full-bleed dark scene base */\n  --surface-base: var(--ink-800);\n  --surface-card: var(--ink-700);       /* card on dark */\n  --surface-light: var(--brandty-white);/* light-mode pieces */\n  --surface-light-muted: var(--ink-050);\n\n  /* Text — on dark */\n  --text-on-dark: var(--brandty-white);\n  --text-on-dark-muted: var(--ink-300);\n  --text-on-dark-faint: var(--ink-400);\n  /* Text — on light */\n  --text-on-light: var(--ink-600);\n  --text-on-light-muted: var(--ink-500);\n\n  /* Brand-role text */\n  --text-accent: var(--brandty-blue);   /* brand headlines / numbers / labels */\n  --text-alert: var(--brandty-coral);   /* warnings, \"revisar\", exceptions */\n\n  /* Lines & strokes (functional linear iconography / dividers) */\n  --line-on-dark: rgba(255, 255, 255, 0.16);\n  --line-accent: var(--brandty-blue);\n  --line-strong: var(--brandty-white);\n\n  /* Interactive */\n  --action-primary: var(--brandty-coral);   /* CTA buttons (coral chip in refs) */\n  --action-primary-hover: var(--coral-500);\n  --action-secondary: var(--brandty-blue);\n  --action-secondary-hover: var(--blue-500);\n\n  /* Overlay — the signature dark scrim over scene photography */\n  --overlay-scene: rgba(16, 18, 20, 0.62);\n  --overlay-scene-strong: rgba(16, 18, 20, 0.78);\n  --overlay-bottom: linear-gradient(180deg, rgba(16,18,20,0) 0%, rgba(16,18,20,0.85) 78%); /* @kind color */\n  --overlay-top: linear-gradient(180deg, rgba(16,18,20,0.82) 0%, rgba(16,18,20,0) 60%); /* @kind color */\n}\n\n/* ============================================================\n   BRANDTY · TYPOGRAPHY TOKENS\n   Single real brand family — Jornada Sans — across all roles,\n   differentiated by weight:\n   - Display/Statement: Heavy 800 — big editorial headlines\n   - Brand/labels:      Bold 700 — numbered titles, eyebrows\n   - Body/UI:           Book 400 / Medium 500\n   ============================================================ */\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Jornada Sans', system-ui, -apple-system, sans-serif;\n  --font-brand: 'Jornada Sans', system-ui, -apple-system, sans-serif;\n  --font-body: 'Jornada Sans', system-ui, -apple-system, sans-serif;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium: 500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700; /* @kind font */\n  --fw-extrabold: 800; /* @kind font */\n  --fw-black: 900; /* @kind font */\n\n  /* ---- Fluid type scale (creative canvases are large) ---- */\n  --text-display-xl: 88px;   /* hero statement on a square/portrait creative */\n  --text-display-lg: 64px;\n  --text-display-md: 48px;\n  --text-headline: 36px;     /* numbered section titles */\n  --text-title: 28px;\n  --text-subtitle: 22px;\n  --text-body-lg: 19px;\n  --text-body: 17px;\n  --text-caption: 15px;\n  --text-label: 13px;        /* uppercase eyebrows / tags */\n\n  /* ---- Line heights ---- */\n  --lh-tight: 0.98; /* @kind font */          /* big stacked statement headlines */\n  --lh-snug: 1.08; /* @kind font */\n  --lh-heading: 1.16; /* @kind font */\n  --lh-body: 1.5; /* @kind font */\n  --lh-relaxed: 1.62; /* @kind font */\n\n  /* ---- Letter spacing ---- */\n  --ls-tight: -0.02em; /* @kind font */       /* heavy display */\n  --ls-snug: -0.01em; /* @kind font */\n  --ls-normal: 0; /* @kind font */\n  --ls-label: 0.14em; /* @kind font */        /* uppercase eyebrows */\n\n  /* ---- Semantic roles ---- */\n  --type-statement: var(--fw-extrabold) var(--text-display-lg)/var(--lh-tight) var(--font-display); /* @kind font */\n  --type-headline: var(--fw-semibold) var(--text-headline)/var(--lh-heading) var(--font-brand); /* @kind font */\n  --type-body: var(--fw-regular) var(--text-body)/var(--lh-body) var(--font-body); /* @kind font */\n  --type-eyebrow: var(--fw-semibold) var(--text-label)/1 var(--font-body); /* @kind font */\n}\n\n/* ============================================================\n   BRANDTY · SPACING & LAYOUT TOKENS\n   8px base grid. Creative canvases are generously padded.\n   ============================================================ */\n:root {\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 80px;\n  --space-10: 112px;\n\n  /* Creative safe-margin (keep text off the edge of a post) */\n  --pad-creative: 72px;     /* 1080px square pieces */\n  --pad-creative-sm: 48px;\n\n  /* Common creative canvas sizes (reference) */\n  --canvas-square: 1080px;       /* IG / FB square */\n  --canvas-portrait-w: 1080px;   /* IG portrait 4:5 */\n  --canvas-portrait-h: 1350px;\n  --canvas-linkedin-w: 1200px;   /* LinkedIn landscape */\n  --canvas-linkedin-h: 627px;\n  --canvas-carousel: 1080px;     /* square carousel slide */\n}\n\n/* ============================================================\n   BRANDTY · EFFECTS — radii, borders, shadows, overlays\n   The brand is flat & editorial. Radii are modest, shadows soft\n   and only used to lift floating UI mock elements over a scene.\n   ============================================================ */\n:root {\n  /* ---- Corner radii ---- */\n  --radius-none: 0;\n  --radius-sm: 6px;\n  --radius-md: 10px;       /* default card / chip */\n  --radius-lg: 16px;       /* floating mock panels (offer card, note) */\n  --radius-pill: 999px;    /* CTA chips, tags */\n\n  /* ---- Borders ---- */\n  --border-hairline: 1px solid var(--line-on-dark);\n  --border-accent: 1.5px solid var(--brandty-blue);\n  --border-functional: 2px solid var(--brandty-blue);   /* linear icon strokes */\n\n  /* ---- Shadows (only for floating mock UI over a dark scene) ---- */\n  --shadow-float: 0 18px 48px -12px rgba(0, 0, 0, 0.55);\n  --shadow-card: 0 8px 24px -8px rgba(0, 0, 0, 0.45);\n  --shadow-chip: 0 4px 14px -4px rgba(254, 134, 117, 0.45);  /* coral CTA glow */\n\n  /* ---- Icon stroke system (functional linear iconography) ---- */\n  --icon-stroke-w: 2px; /* @kind spacing */\n  --icon-stroke: var(--brandty-blue);\n  --icon-size: 28px;\n\n  /* ---- Motion (subtle, editorial — fades, no bounce) ---- */\n  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 240ms; /* @kind other */\n  --dur-slow: 420ms; /* @kind other */\n}\n\n<\u002Fstyle>\n<style>\n  *, *::before, *::after { box-sizing: border-box; }\n  html { -webkit-text-size-adjust: 100%; }\n  body {\n    margin: 0;\n    font: var(--type-body);\n    color: var(--brandty-white);\n    background: var(--brandty-gray);\n    -webkit-font-smoothing: antialiased;\n    line-height: var(--lh-body);\n  }\n  :root {\n    --st-red: var(--coral-400);\n    --st-amber: #E8B04B;\n    --st-green: #5FB98A;\n    --panel: color-mix(in srgb, #000 26%, var(--brandty-gray));   /* card on gray */\n    --panel-2: color-mix(in srgb, #000 38%, var(--brandty-gray));\n    --hair: rgba(255,255,255,0.14);\n    --hair-soft: rgba(255,255,255,0.08);\n  }\n  a { color: inherit; }\n  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }\n  .muted { color: var(--ink-200); }\n  .faint { color: var(--ink-300); }\n\n  /* eyebrow / labels */\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 16px;\n    font: var(--fw-semibold) var(--text-label)/1 var(--font-brand);\n    letter-spacing: var(--ls-label); text-transform: uppercase;\n    color: var(--text-accent); margin: 0 0 22px;\n  }\n  .eyebrow::before { content: \"\"; width: 40px; height: 2px; background: var(--brandty-blue); display: block; }\n  .lbl-mini {\n    font: var(--fw-semibold) var(--text-label)/1 var(--font-brand);\n    letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-300);\n  }\n\n  /* ---------- Top bar ---------- */\n  .topbar {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 24px 0; border-bottom: 1px solid var(--hair);\n    position: sticky; top: 0; z-index: 30;\n    background: color-mix(in srgb, #000 8%, var(--brandty-gray));\n    backdrop-filter: blur(8px);\n  }\n  .topbar img { height: 44px; width: auto; display: block; }\n  .topbar .seal {\n    font: var(--fw-semibold) var(--text-label)/1.3 var(--font-brand);\n    letter-spacing: var(--ls-label); text-transform: uppercase; text-align: right;\n    color: var(--ink-200);\n  }\n\n  /* ---------- Cover ---------- */\n  .cover { padding: 78px 0 34px; }\n  .cover h1 {\n    font: var(--fw-extrabold) clamp(44px, 6.6vw, 88px)/0.97 var(--font-display);\n    letter-spacing: var(--ls-tight); margin: 0 0 26px; max-width: 16ch; text-wrap: balance;\n  }\n  .cover h1 .hl { color: var(--text-accent); }\n  .cover .lead {\n    font-size: var(--text-subtitle); color: var(--ink-200);\n    line-height: var(--lh-relaxed); margin: 0; max-width: 640px; text-wrap: pretty;\n  }\n  .rule {\n    display: flex; gap: 18px; align-items: flex-start;\n    margin: 40px 0 0; padding: 22px 26px; max-width: 760px;\n    background: var(--panel); border: 1px solid var(--hair); border-left: 3px solid var(--brandty-coral);\n    border-radius: 8px;\n  }\n  .rule .rk {\n    font: var(--fw-bold) var(--text-label)/1 var(--font-brand);\n    letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-alert);\n    white-space: nowrap; padding-top: 3px;\n  }\n  .rule p { margin: 0; font-size: var(--text-body-lg); color: var(--brandty-white); line-height: 1.45; }\n\n  .cover-info {\n    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;\n    margin: 40px 0 0; background: var(--hair); border: 1px solid var(--hair); border-radius: 8px; overflow: hidden;\n  }\n  .cover-info div { background: var(--panel); padding: 22px 24px; }\n  .cover-info div b { display: block; font: var(--fw-bold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-accent); margin-bottom: 10px; }\n  .cover-info div p { margin: 0; font-size: var(--text-body); color: var(--ink-100); line-height: 1.45; }\n\n  /* ---------- Chapter divider ---------- */\n  .chapter { padding: 70px 0 6px; }\n  .chapter .pg {\n    display: flex; align-items: center; justify-content: space-between; gap: 20px;\n    border-bottom: 1px solid var(--hair); padding-bottom: 14px; margin-bottom: 30px;\n  }\n  .chapter .pg .k {\n    font: var(--fw-semibold) var(--text-label)/1 var(--font-brand);\n    letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-accent);\n  }\n  .chapter .pg .n { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); color: var(--ink-400); }\n  .chapter h2 {\n    font: var(--fw-extrabold) clamp(28px, 3.6vw, 46px)/1.04 var(--font-display);\n    letter-spacing: var(--ls-tight); margin: 0 0 18px; max-width: 22ch; text-wrap: balance;\n  }\n  .chapter .intro { font-size: var(--text-body-lg); color: var(--ink-200); line-height: 1.6; max-width: 760px; margin: 0; text-wrap: pretty; }\n\n  /* ---------- 4 errores ---------- */\n  .errors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin: 34px 0 0; }\n  .err {\n    display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start;\n    background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 22px 24px;\n  }\n  .err .num { font: var(--fw-extrabold) 34px/1 var(--font-display); color: var(--text-alert); letter-spacing: var(--ls-tight); }\n  .err b { display: block; font: var(--fw-bold) var(--text-body-lg)/1.25 var(--font-brand); margin: 2px 0 8px; }\n  .err p { margin: 0; font-size: var(--text-body); color: var(--ink-200); line-height: 1.5; }\n\n  /* ---------- Callouts ---------- */\n  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 26px; }\n  .callout { padding: 22px 26px; border-radius: 8px; background: var(--panel); border: 1px solid var(--hair); }\n  .callout .ck { font: var(--fw-bold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; margin: 0 0 12px; }\n  .callout p { margin: 0; font-size: var(--text-body); color: var(--ink-100); line-height: 1.55; }\n  .callout--crit { border-left: 3px solid var(--brandty-blue); }\n  .callout--crit .ck { color: var(--text-accent); }\n  .callout--criterio { border-left: 3px solid var(--accent-olive); }\n  .callout--criterio .ck { color: var(--accent-olive); }\n  .callout--warn { border-left: 3px solid var(--brandty-coral); background: color-mix(in srgb, var(--brandty-coral) 7%, var(--panel)); }\n  .callout--warn .ck { color: var(--text-alert); }\n\n  /* ---------- Meta form ---------- */\n  .form-grid {\n    display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;\n    background: var(--hair); border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; margin: 4px 0 0;\n  }\n  .form-grid label { display: flex; flex-direction: column; gap: 9px; background: var(--panel); padding: 16px 20px; }\n  .form-grid.cols-1 { grid-template-columns: 1fr; }\n  .form-grid label span { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-400); }\n  .form-grid input { border: none; background: transparent; color: var(--brandty-white); font: var(--fw-medium) var(--text-body)/1.3 var(--font-body); padding: 0; width: 100%; }\n  .form-grid input:focus { outline: none; }\n  .form-grid input::placeholder { color: var(--ink-500); }\n\n  /* ---------- Score legend ---------- */\n  .howto { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 24px 0 0; padding: 16px 22px; background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; }\n  .howto .lbl { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-400); margin-right: 6px; }\n  .howto .key { display: inline-flex; align-items: center; gap: 10px; font-size: var(--text-caption); color: var(--ink-100); }\n  .howto .key b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--hair); color: var(--brandty-white); font: var(--fw-bold) 14px/1 var(--font-brand); }\n\n  /* ---------- Checklist layout ---------- */\n  .layout { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 44px; align-items: start; padding: 6px 0 40px; }\n\n  .section { background: var(--panel); border: 1px solid var(--hair); border-radius: 10px; margin-bottom: 22px; overflow: hidden; }\n  .section > header { display: flex; align-items: baseline; gap: 18px; padding: 26px 30px 22px; border-bottom: 1px solid var(--hair); }\n  .section > header .ix { font: var(--fw-extrabold) 30px/1 var(--font-display); color: var(--text-accent); letter-spacing: var(--ls-tight); }\n  .section > header .ttl { flex: 1; min-width: 0; }\n  .section > header .ttl h3 { font: var(--fw-bold) var(--text-title)/1.2 var(--font-brand); margin: 0; letter-spacing: var(--ls-snug); }\n  .section > header .sub { text-align: right; white-space: nowrap; font: var(--fw-semibold) var(--text-label)/1.3 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-400); }\n  .section > header .sub b { display: block; font: var(--fw-extrabold) 22px/1 var(--font-display); color: var(--brandty-white); letter-spacing: 0; margin-top: 4px; }\n\n  .item { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 20px 30px; border-bottom: 1px solid var(--hair-soft); }\n  .item:last-child { border-bottom: none; }\n  .item .txt { min-width: 0; }\n  .item .txt p { margin: 0; font-size: var(--text-body); color: var(--brandty-white); line-height: 1.42; text-wrap: pretty; }\n  .item .txt .note { margin: 7px 0 0; font-size: var(--text-caption); color: var(--ink-300); line-height: 1.45; }\n\n  .seg { display: inline-flex; gap: 8px; }\n  .seg button { appearance: none; cursor: pointer; width: 46px; height: 46px; border-radius: 7px; background: transparent; border: 1.5px solid var(--hair); color: var(--ink-200); font: var(--fw-bold) 18px/1 var(--font-brand); transition: background .14s, border-color .14s, color .14s, transform .06s; }\n  .seg button:hover { border-color: var(--ink-300); color: var(--brandty-white); }\n  .seg button:active { transform: translateY(1px); }\n  .seg button:focus-visible { outline: 2px solid var(--brandty-blue); outline-offset: 2px; }\n  .seg button[aria-pressed=\"true\"] { background: var(--brandty-blue); border-color: var(--brandty-blue); color: var(--ink-900); }\n  .seg button[data-v=\"0\"][aria-pressed=\"true\"] { background: var(--st-red); border-color: var(--st-red); color: #fff; }\n\n  /* capture box (free text) */\n  .capture { margin: 18px 0 2px; }\n  .capture label { display: block; font: var(--fw-bold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-300); margin-bottom: 10px; }\n  .capture textarea { width: 100%; min-height: 92px; resize: vertical; background: var(--panel-2); border: 1px solid var(--hair); border-radius: 8px; color: var(--brandty-white); font: var(--fw-regular) var(--text-body)/1.5 var(--font-body); padding: 14px 16px; }\n  .capture textarea:focus { outline: none; border-color: var(--brandty-blue); }\n  .capture textarea::placeholder { color: var(--ink-500); }\n\n  /* ---------- Checklist of questions / chips ---------- */\n  .qlist { display: grid; gap: 10px; margin: 4px 0 0; }\n  .check { display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left; cursor: pointer; appearance: none; background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 16px 18px; color: var(--brandty-white); transition: border-color .14s, background .14s; }\n  .check:hover { border-color: var(--ink-300); }\n  .check .box { flex: none; width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--ink-300); display: grid; place-items: center; margin-top: 1px; transition: background .14s, border-color .14s; }\n  .check .box::after { content: \"\"; width: 11px; height: 6px; border-left: 2px solid var(--ink-900); border-bottom: 2px solid var(--ink-900); transform: rotate(-45deg) scale(0); transform-origin: center; margin-top: -2px; transition: transform .12s; }\n  .check[aria-pressed=\"true\"] { border-color: var(--brandty-blue); background: color-mix(in srgb, var(--brandty-blue) 10%, var(--panel)); }\n  .check[aria-pressed=\"true\"] .box { background: var(--brandty-blue); border-color: var(--brandty-blue); }\n  .check[aria-pressed=\"true\"] .box::after { transform: rotate(-45deg) scale(1); }\n  .check .ct { font-size: var(--text-body); line-height: 1.4; }\n\n  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 4px 0 0; }\n  .chips .check { align-items: center; }\n\n  /* ---------- Rail / live result ---------- */\n  .rail { position: sticky; top: 96px; }\n  .result { background: var(--panel-2); border: 1px solid var(--hair); border-radius: 12px; padding: 28px 26px; overflow: hidden; }\n  .result .reye { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-400); margin: 0 0 18px; }\n  .score { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }\n  .score .n { font: var(--fw-extrabold) 76px/0.9 var(--font-display); letter-spacing: var(--ls-tight); }\n  .score .d { font: var(--fw-bold) 26px/1 var(--font-display); color: var(--ink-400); }\n  .answered { font-size: var(--text-caption); color: var(--ink-400); margin: 0 0 22px; }\n  .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 6px; }\n  .track .fill { height: 100%; width: 0%; border-radius: 99px; background: var(--st-red); transition: width .35s cubic-bezier(.2,.7,.2,1), background .35s; }\n  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-400); margin-bottom: 24px; letter-spacing: .04em; }\n  .lights { display: flex; flex-direction: column; gap: 10px; }\n  .lamp { display: flex; align-items: center; gap: 14px; padding: 13px 15px; border-radius: 8px; border: 1px solid var(--hair); background: var(--panel); opacity: .42; transition: opacity .25s, border-color .25s, background .25s; }\n  .lamp .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; background: currentColor; }\n  .lamp .lt b { display: block; font: var(--fw-bold) var(--text-caption)/1.1 var(--font-brand); letter-spacing: .02em; text-transform: uppercase; color: var(--brandty-white); }\n  .lamp .lt span { font-size: 12px; color: var(--ink-300); }\n  .lamp.red { color: var(--st-red); } .lamp.amber { color: var(--st-amber); } .lamp.green { color: var(--st-green); }\n  .lamp.on { opacity: 1; border-color: currentColor; background: color-mix(in srgb, currentColor 14%, var(--panel)); }\n  .lamp.on .dot { box-shadow: 0 0 16px 1px currentColor; }\n  .verdict { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--hair); }\n  .verdict h4 { margin: 0 0 8px; font: var(--fw-bold) var(--text-body-lg)/1.25 var(--font-brand); }\n  .verdict p { margin: 0 0 14px; font-size: var(--text-caption); color: var(--ink-200); line-height: 1.5; }\n  .verdict .dec { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-400); margin: 0 0 6px; }\n  .verdict .decTxt { font-size: var(--text-body); color: var(--brandty-white); line-height: 1.4; margin: 0; }\n  .actions { display: flex; gap: 10px; margin-top: 22px; }\n  .actions button { flex: 1; cursor: pointer; appearance: none; border-radius: 7px; padding: 13px 14px; font: var(--fw-bold) var(--text-caption)/1 var(--font-brand); letter-spacing: .03em; transition: background .15s, color .15s, border-color .15s; }\n  .btn-print { background: var(--action-primary); border: 1.5px solid var(--action-primary); color: #fff; }\n  .btn-print:hover { background: var(--action-primary-hover); border-color: var(--action-primary-hover); }\n  .btn-reset { background: transparent; border: 1.5px solid var(--hair); color: var(--ink-200); }\n  .btn-reset:hover { border-color: var(--ink-300); color: var(--brandty-white); }\n\n  /* ---------- Diagnosis cards (page 7) ---------- */\n  .diag-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 30px 0 0; }\n  .diag-card { background: var(--panel); border: 1px solid var(--hair); border-top: 4px solid currentColor; border-radius: 10px; padding: 24px 24px 26px; opacity: .58; transition: opacity .25s, box-shadow .25s; }\n  .diag-card.red { color: var(--st-red); } .diag-card.amber { color: var(--st-amber); } .diag-card.green { color: var(--st-green); }\n  .diag-card.on { opacity: 1; box-shadow: 0 0 0 1px currentColor inset; }\n  .diag-card .rng { font: var(--fw-bold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: currentColor; margin: 0 0 6px; }\n  .diag-card h4 { margin: 0 0 12px; font: var(--fw-extrabold) var(--text-title)/1.1 var(--font-display); color: var(--brandty-white); }\n  .diag-card > p { margin: 0 0 16px; font-size: var(--text-body); color: var(--ink-100); line-height: 1.5; }\n  .diag-card .decl { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-400); margin: 0 0 5px; }\n  .diag-card .decv { margin: 0; font-size: var(--text-body); color: var(--brandty-white); line-height: 1.4; }\n\n  /* ---------- Decision page ---------- */\n  .risks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 4px 0 0; }\n  .risks label, .next label { display: flex; flex-direction: column; gap: 9px; }\n  .risks label span, .next label span { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-400); }\n  .risks input, .next input { background: var(--panel-2); border: 1px solid var(--hair); border-radius: 8px; color: var(--brandty-white); font: var(--fw-medium) var(--text-body)/1.3 var(--font-body); padding: 13px 15px; }\n  .risks input:focus, .next input:focus { outline: none; border-color: var(--brandty-blue); }\n  .risks input::placeholder, .next input::placeholder { color: var(--ink-500); }\n  .next { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }\n\n  .block-label { font: var(--fw-bold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-300); margin: 30px 0 14px; display: block; }\n\n  /* ---------- CTA ---------- */\n  .help { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: start; margin-top: 30px; }\n  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; margin: 30px 0 0; }\n  .stats div { background: var(--panel); padding: 24px 22px; }\n  .stats div b { display: block; font: var(--fw-extrabold) 32px/1 var(--font-display); color: var(--text-accent); }\n  .stats div span { font-size: 12px; color: var(--ink-300); text-transform: uppercase; letter-spacing: .08em; margin-top: 8px; display: block; }\n\n  .cta { margin: 40px 0 70px; padding: 48px 44px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--hair); display: grid; grid-template-columns: 1fr auto; gap: 36px; align-items: center; }\n  .cta .ce { font: var(--fw-semibold) var(--text-label)/1 var(--font-brand); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-accent); margin: 0 0 16px; }\n  .cta h2 { margin: 0 0 12px; font: var(--fw-extrabold) clamp(28px,3vw,42px)/1.05 var(--font-display); letter-spacing: var(--ls-tight); }\n  .cta p { margin: 0; color: var(--ink-200); font-size: var(--text-body); max-width: 560px; line-height: 1.5; }\n  .cta .go { display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; background: var(--action-primary); color: #fff; text-decoration: none; padding: 18px 28px; border-radius: 8px; font: var(--fw-bold) var(--text-body)/1 var(--font-brand); transition: background .15s, transform .08s; }\n  .cta .go:hover { background: var(--action-primary-hover); }\n  .cta .go:active { transform: translateY(1px); }\n  .footnote { text-align: center; color: var(--ink-300); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding-bottom: 60px; }\n  .nocv { text-align: center; color: var(--ink-400); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; max-width: 720px; margin: 0 auto 26px; line-height: 1.7; }\n\n  /* mobile sticky mini-bar */\n  .minibar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 20px; background: rgba(20,21,23,0.94); backdrop-filter: blur(10px); border-top: 1px solid var(--hair); }\n  .minibar .ms { display: flex; align-items: center; gap: 12px; }\n  .minibar .ms .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--st-red); box-shadow: 0 0 12px currentColor; }\n  .minibar .ms b { font: var(--fw-extrabold) 22px/1 var(--font-display); }\n  .minibar .ms b span { font-size: 14px; color: var(--ink-400); }\n  .minibar .mz { font: var(--fw-bold) var(--text-caption)/1 var(--font-brand); text-transform: uppercase; letter-spacing: .06em; }\n\n  @media (max-width: 980px) {\n    .layout { grid-template-columns: 1fr; }\n    .rail { position: static; order: -1; }\n    .result { display: none; }\n    .minibar { display: flex; }\n    .errors, .twocol, .cover-info, .help, .diag-cards, .risks, .next, .chips { grid-template-columns: 1fr; }\n    .stats { grid-template-columns: repeat(2, 1fr); }\n    .form-grid { grid-template-columns: 1fr; }\n    .cta { grid-template-columns: 1fr; }\n    .layout { padding-bottom: 90px; }\n  }\n  @media (max-width: 560px) {\n    .wrap { padding: 0 18px; }\n    .item { grid-template-columns: 1fr; gap: 14px; }\n    .section > header { padding: 20px 20px 18px; }\n    .item { padding: 18px 20px; }\n  }\n\n  @media print {\n    body { background: #fff; color: #111; }\n    .topbar { position: static; background: #fff; }\n    .howto, .actions, .minibar, .footnote { display: none !important; }\n    .layout { display: block; padding: 0; }\n    .section, .result, .callout, .err, .diag-card, .cover-info div, .stats div, .check, .capture textarea, .cta { border-color: #ccc; background: #fff; color: #111; }\n    .chapter h2, .cover h1, .item .txt p, .err b, .diag-card h4 { color: #111 !important; }\n    .eyebrow, .chapter .pg .k, .reye, .section > header .ix, .cover-info div b, .stats div b { color: #2B6373 !important; }\n    .rail { position: static; }\n    .result { display: block; margin-top: 20px; }\n    .lamp, .diag-card { opacity: 1; }\n    .chapter, .section, .callout, .diag-card, .err, .cta { break-inside: avoid; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <div class=\"wrap\">\n    <div class=\"topbar\">\n      <img src=\"fb7b0656-1782-4e24-9476-12ad1a450ada\" alt=\"Brandty\">\n      <span class=\"seal\">Selección × Valores®<br>Auditoría Express<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- ============ COVER ============ -->\n    <header class=\"cover\">\n      <p class=\"eyebrow\">Diagnóstico honesto en 20 minutos<\u002Fp>\n      <h1>Contratar perfiles difíciles es <span class=\"hl\">más complejo<\u002Fspan> de lo que parece.<\u002Fh1>\n      <p class=\"lead\">Señales, errores y decisiones clave antes de abrir una vacante técnica, directiva o estratégica.<\u002Fp>\n\n      <div class=\"rule\">\n        <span class=\"rk\">Regla crítica<\u002Fspan>\n        <p>En perfiles escasos, la empresa también compite. Publicar una oferta no es suficiente.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"cover-info\">\n        <div><b>Uso<\u002Fb><p>Puntúa 0, 1 o 2 según lo que tienes realmente, no lo que quieres tener.<\u002Fp><\u002Fdiv>\n        <div><b>Para quién<\u002Fb><p>Dirección, RRHH y responsables técnicos del proceso.<\u002Fp><\u002Fdiv>\n        <div><b>Decisión<\u002Fb><p>Salir preparado, ajustar antes de publicar o pedir apoyo externo.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ============ ANTES DE PUBLICAR ============ -->\n    <section class=\"chapter\">\n      <div class=\"pg\"><span class=\"k\">Antes de publicar<\u002Fspan><span class=\"n\">01<\u002Fspan><\u002Fdiv>\n      <h2>Una reunión honesta ahora evita semanas perdidas después.<\u002Fh2>\n      <p class=\"intro\">Contratar bien no empieza cuando llegan los CVs. Empieza cuando la empresa entiende qué problema necesita resolver, qué perfil puede atraer de verdad y cómo va a decidir.<\u002Fp>\n\n      <div class=\"form-grid\" style=\"margin-top:26px\">\n        <label><span>Empresa<\u002Fspan><input data-note=\"empresa\" type=\"text\" placeholder=\"Nombre\" autocomplete=\"off\"><\u002Flabel>\n        <label><span>Puesto / vacante<\u002Fspan><input data-note=\"puesto\" type=\"text\" placeholder=\"Perfil\" autocomplete=\"off\"><\u002Flabel>\n        <label><span>Fecha<\u002Fspan><input data-note=\"fecha\" type=\"text\" placeholder=\"dd/mm/aaaa\" autocomplete=\"off\"><\u002Flabel>\n        <label><span>Responsable del proceso<\u002Fspan><input data-note=\"responsable\" type=\"text\" placeholder=\"Quién lidera\" autocomplete=\"off\"><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"form-grid cols-1\" style=\"margin-top:1px\">\n        <label><span>Participantes en esta auditoría<\u002Fspan><input data-note=\"participantes\" type=\"text\" placeholder=\"Quién la rellena hoy\" autocomplete=\"off\"><\u002Flabel>\n      <\u002Fdiv>\n\n      <span class=\"block-label\">Los 4 errores que convierten una vacante en un problema<\u002Fspan>\n      <div class=\"errors\">\n        <div class=\"err\"><span class=\"num\">1<\u002Fspan><div><b>Salir al mercado sin consenso interno<\u002Fb><p>Cuando dirección, RRHH y el área solicitante no están alineados en lo esencial, los candidatos lo notan. Y se van.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"err\"><span class=\"num\">2<\u002Fspan><div><b>Pedir un perfil que la oferta no puede atraer<\u002Fb><p>Exigir 10 años de experiencia con un salario de 3. O pedir autonomía en una empresa que no la da. El mercado no perdona la incoherencia.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"err\"><span class=\"num\">3<\u002Fspan><div><b>Decidir lento cuando aparece talento bueno<\u002Fb><p>Un candidato excepcional no espera dos semanas a que «lo vea dirección». Tiene otras ofertas. Si tardas, pierdes.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"err\"><span class=\"num\">4<\u002Fspan><div><b>Evaluar solo CV y olvidar lo que sostiene la permanencia<\u002Fb><p>Experiencia, expectativas, cultura, valores y encaje real con el liderazgo. Sin eso, contratas a alguien que se va en 6 meses.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"twocol\">\n        <div class=\"callout callout--criterio\"><p class=\"ck\">Criterio Brandty<\u002Fp><p>Una vacante difícil no se arregla publicándola más veces ni bajando el perfil. Se corrige ajustando definición, propuesta, ritmo de decisión y acceso real al mercado.<\u002Fp><\u002Fdiv>\n        <div class=\"callout callout--crit\"><p class=\"ck\">Cómo usar esta auditoría<\u002Fp><p>Puntúa según evidencias, no intenciones. Si no hay consenso entre los implicados, no lo marques como cumplido. Escribe los riesgos con nombres propios.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ LO QUE CAMBIA ============ -->\n    <section class=\"chapter\">\n      <div class=\"pg\"><span class=\"k\">Lo que cambia en perfiles difíciles<\u002Fspan><span class=\"n\">02<\u002Fspan><\u002Fdiv>\n      <h2>No todos los procesos de selección se pueden tratar igual.<\u002Fh2>\n      <p class=\"intro\">Cuando buscas perfiles técnicos, ingenieros/as, mandos intermedios o directivos/as, la lógica cambia por completo. Las mejores candidaturas no están buscando activamente. Ya trabajan. Tienen estabilidad. Comparan proyectos. Valoran el liderazgo. Y si el proceso es lento, confuso o poco atractivo, desaparecen sin decirte por qué.<\u002Fp>\n\n      <span class=\"block-label\">Antes de abrir la vacante · ¿Tienes respuesta a estas preguntas?<\u002Fspan>\n      <div class=\"qlist\" id=\"prequestions\"><\u002Fdiv>\n\n      <div class=\"twocol\">\n        <div class=\"callout callout--crit\"><p class=\"ck\">Pregunta crítica<\u002Fp><p>¿Puede la empresa explicar con claridad por qué una persona buena debería dejar su puesto actual para venir aquí? Si la respuesta dura más de 2 minutos o genera dudas internas, hay un problema.<\u002Fp><\u002Fdiv>\n        <div class=\"callout callout--criterio\"><p class=\"ck\">Criterio Brandty<\u002Fp><p>El candidato técnico no compra solo salario. Compra proyecto, liderazgo, estabilidad, autonomía y coherencia. Si no puedes vender eso, la oferta económica no compensará.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"callout callout--warn\" style=\"margin-top:18px\"><p class=\"ck\">No publiques si…<\u002Fp><p>No puedes explicar salario, proyecto, responsable directo, autonomía, tiempos y criterios de decisión en menos de cinco minutos. Publicar antes de tener esto claro solo quema la vacante.<\u002Fp><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ CHECKLIST + RAIL ============ -->\n    <div class=\"howto\">\n      <span class=\"lbl\">Cómo puntuar<\u002Fspan>\n      <span class=\"key\"><b>0<\u002Fb> No existe<\u002Fspan>\n      <span class=\"key\"><b>1<\u002Fb> Existe a medias<\u002Fspan>\n      <span class=\"key\"><b>2<\u002Fb> Claro y ejecutado<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"layout\">\n      <main id=\"chapters\"><\u002Fmain>\n\n      <aside class=\"rail\">\n        <div class=\"result\">\n          <p class=\"reye\">Puntuación y diagnóstico<\u002Fp>\n          <div class=\"score\"><span class=\"n\" id=\"r_score\">0<\u002Fspan><span class=\"d\">/ 80<\u002Fspan><\u002Fdiv>\n          <p class=\"answered\" id=\"r_answered\">0 de 40 elementos puntuados<\u002Fp>\n          <div class=\"track\"><div class=\"fill\" id=\"r_fill\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"ticks\"><span>0<\u002Fspan><span>33<\u002Fspan><span>57<\u002Fspan><span>80<\u002Fspan><\u002Fdiv>\n          <div class=\"lights\">\n            <div class=\"lamp red\" data-zone=\"red\"><span class=\"dot\"><\u002Fspan><span class=\"lt\"><b>Rojo · 0–33<\u002Fb><span>Proceso en riesgo<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div class=\"lamp amber\" data-zone=\"amber\"><span class=\"dot\"><\u002Fspan><span class=\"lt\"><b>Amarillo · 34–57<\u002Fb><span>Revisar antes<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div class=\"lamp green\" data-zone=\"green\"><span class=\"dot\"><\u002Fspan><span class=\"lt\"><b>Verde · 58–80<\u002Fb><span>Proceso preparado<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"verdict\">\n            <h4 id=\"v_title\">Aún sin puntuar<\u002Fh4>\n            <p id=\"v_desc\">Marca los elementos para ver tu diagnóstico y la decisión recomendada.<\u002Fp>\n            <p class=\"dec\">Decisión recomendada<\u002Fp>\n            <p class=\"decTxt\" id=\"v_dec\">—<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"actions\">\n            <button class=\"btn-print\" id=\"btnPrint\">Imprimir / PDF<\u002Fbutton>\n            <button class=\"btn-reset\" id=\"btnReset\">Reiniciar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n\n    <!-- ============ DIAGNÓSTICO (3 cards) ============ -->\n    <section class=\"chapter\">\n      <div class=\"pg\"><span class=\"k\">Puntuación y diagnóstico rápido<\u002Fspan><span class=\"n\">03<\u002Fspan><\u002Fdiv>\n      <h2>Sin datos, se opina. Con datos, se decide.<\u002Fh2>\n      <p class=\"intro\">Suma el total de los apartados A al H sobre 80. Tu semáforo te dice si estás preparado para salir, si toca ajustar o si conviene pedir apoyo antes de quemar la vacante.<\u002Fp>\n      <div class=\"diag-cards\">\n        <div class=\"diag-card red\" data-zone=\"red\"><p class=\"rng\">Rojo · 0–33<\u002Fp><h4>Proceso en riesgo<\u002Fh4><p>Sin consenso. Perfil escaso. Ya se intentó cubrir sin éxito. Sin tiempo para búsqueda activa. Posición crítica o confidencial.<\u002Fp><p class=\"decl\">Decisión recomendada<\u002Fp><p class=\"decv\">No quemar la vacante. Pedir apoyo externo o rediseñar el proceso.<\u002Fp><\u002Fdiv>\n        <div class=\"diag-card amber\" data-zone=\"amber\"><p class=\"rng\">Amarillo · 34–57<\u002Fp><h4>Revisar antes<\u002Fh4><p>Dudas sobre salario, prioridades o decisores. La oferta puede no ser atractiva o el proceso depende de demasiadas personas.<\u002Fp><p class=\"decl\">Decisión recomendada<\u002Fp><p class=\"decv\">Ajustar perfil, oferta, decisores y tiempos antes de publicar.<\u002Fp><\u002Fdiv>\n        <div class=\"diag-card green\" data-zone=\"green\"><p class=\"rng\">Verde · 58–80<\u002Fp><h4>Proceso preparado<\u002Fh4><p>Consenso interno. Perfil y oferta claros. Banda salarial defendible. Proceso ágil. Se evalúa experiencia, expectativas, valores y encaje.<\u002Fp><p class=\"decl\">Decisión recomendada<\u002Fp><p class=\"decv\">Salir al mercado con proceso activo y seguimiento semanal.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ DECISIÓN INTERNA ============ -->\n    <section class=\"chapter\">\n      <div class=\"pg\"><span class=\"k\">Decisión interna y próximo paso<\u002Fspan><span class=\"n\">04<\u002Fspan><\u002Fdiv>\n      <h2>La decisión no es publicar. La decisión es salir preparado.<\u002Fh2>\n\n      <span class=\"block-label\">¿Qué hacemos a partir de hoy?<\u002Fspan>\n      <div class=\"chips\" id=\"decisions\"><\u002Fdiv>\n\n      <span class=\"block-label\">Los 3 riesgos principales (con nombres propios)<\u002Fspan>\n      <div class=\"risks\">\n        <label><span>Riesgo principal 1<\u002Fspan><input data-note=\"risk1\" type=\"text\" placeholder=\"Descríbelo\" autocomplete=\"off\"><\u002Flabel>\n        <label><span>Riesgo principal 2<\u002Fspan><input data-note=\"risk2\" type=\"text\" placeholder=\"Descríbelo\" autocomplete=\"off\"><\u002Flabel>\n        <label><span>Riesgo principal 3<\u002Fspan><input data-note=\"risk3\" type=\"text\" placeholder=\"Descríbelo\" autocomplete=\"off\"><\u002Flabel>\n      <\u002Fdiv>\n\n      <div class=\"next\">\n        <label><span>Próximo paso<\u002Fspan><input data-note=\"step\" type=\"text\" placeholder=\"Acción concreta\" autocomplete=\"off\"><\u002Flabel>\n        <label><span>Fecha límite<\u002Fspan><input data-note=\"deadline\" type=\"text\" placeholder=\"dd/mm/aaaa\" autocomplete=\"off\"><\u002Flabel>\n        <label><span>Responsable<\u002Fspan><input data-note=\"owner\" type=\"text\" placeholder=\"Quién lo ejecuta\" autocomplete=\"off\"><\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ CTA ============ -->\n    <section class=\"chapter\" style=\"padding-bottom:0\">\n      <div class=\"pg\"><span class=\"k\">Cuándo tiene sentido pedir apoyo externo<\u002Fspan><span class=\"n\">05<\u002Fspan><\u002Fdiv>\n      <h2>Si tu semáforo sale amarillo o rojo, no publiques todavía.<\u002Fh2>\n      <p class=\"intro\">Podemos ayudarte a revisar el perfil, la oferta y el ritmo de decisión. Marca lo que aplica a tu caso:<\u002Fp>\n      <div class=\"chips\" id=\"help\" style=\"grid-template-columns:repeat(2,1fr)\"><\u002Fdiv>\n\n      <div class=\"stats\">\n        <div><b>+150K<\u002Fb><span>CVs analizados<\u002Fspan><\u002Fdiv>\n        <div><b>+1.500<\u002Fb><span>procesos de éxito<\u002Fspan><\u002Fdiv>\n        <div><b>+450<\u002Fb><span>clientes satisfechos<\u002Fspan><\u002Fdiv>\n        <div><b>86%<\u002Fb><span>de efectividad<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"cta\">\n        <div>\n          <p class=\"ce\">Agenda 15 minutos con nuestro equipo<\u002Fp>\n          <h2 style=\"margin-bottom:12px\">Revisamos el perfil, la propuesta y el proceso contigo. Sin compromiso.<\u002Fh2>\n          <p>No enviamos CVs. Presentamos finalistas validados por experiencia, expectativas, cultura y valores.<\u002Fp>\n        <\u002Fdiv>\n        <a class=\"go\" href=\"https://api.leadconnectorhq.com/widget/booking/DAzq8b8pTfiEVBDhygx0\" target=\"_blank\" rel=\"noopener\">Quiero que me asesoréis →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <p class=\"nocv\">No enviamos CVs. Presentamos finalistas validados por experiencia, expectativas, cultura y valores.<\u002Fp>\n    <p class=\"footnote\">hola@brandty.es · brandty.es<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"minibar\">\n    <div class=\"ms\"><span class=\"dot\" id=\"mb_dot\"><\u002Fspan><b><span id=\"mb_score\">0<\u002Fspan><span> / 80<\u002Fspan><\u002Fb><\u002Fdiv>\n    <span class=\"mz\" id=\"mb_zone\">Sin puntuar<\u002Fspan>\n  <\u002Fdiv>\n\n<script>\n(function () {\n  \"use strict\";\n\n  var CHAPTERS = [\n    {\n      pg: \"Auditoría de oferta y proceso\", n: \"A·B\",\n      title: \"Lo que el candidato evalúa antes de aceptar tu oferta.\",\n      intro: \"Puntúa cada elemento con honestidad. La oferta debe ser competitiva desde el punto de vista del candidato, no solo desde el de la empresa.\",\n      sections: [\"A\", \"B\"],\n      crit: \"¿La oferta es competitiva desde el punto de vista del candidato o solo desde el punto de vista de la empresa? Son dos cosas muy distintas.\",\n      capture: { key: \"bloqueos\", label: \"Bloqueos detectados\", ph: \"Anota aquí los bloqueos de oferta o proceso, con nombres propios.\" }\n    },\n    {\n      pg: \"Evaluación del encaje\", n: \"C·D\",\n      title: \"La experiencia abre la puerta. El encaje sostiene la permanencia.\",\n      intro: \"Contratar solo por CV multiplica el riesgo. Una persona puede cumplir todos los requisitos técnicos y aun así no encajar con el liderazgo, la autonomía real o la cultura: baja antes de los 12 meses y el coste se duplica.\",\n      sections: [\"C\", \"D\"],\n      crit: \"¿Estás evaluando a la persona que necesitas o intentando confirmar la primera impresión? El sesgo de confirmación es el error más caro de la selección.\",\n      criterio: \"No se trata de encontrar a alguien que cumpla los requisitos. Se trata de validar si esa persona puede funcionar, quedarse y aportar en ese contexto concreto.\"\n    },\n    {\n      pg: \"Liderazgo, cultura y onboarding\", n: \"E·F·G\",\n      title: \"Aquí se gana o se pierde buena parte de la permanencia.\",\n      intro: \"Una incorporación no falla solo por falta de capacidad técnica. Falla por expectativas mal gestionadas, liderazgo poco claro o una llegada improvisada. Reemplazar a alguien en los primeros 6 meses cuesta entre 0,5 y 1,5 veces su salario anual.\",\n      sections: [\"E\", \"F\", \"G\"],\n      capture: { key: \"riesgos\", label: \"Riesgos de liderazgo / cultura / onboarding detectados\", ph: \"Anota los riesgos detectados antes de incorporar.\" }\n    },\n    {\n      pg: \"Datos que importan\", n: \"H\",\n      title: \"Lo que no se mide, no se decide.\",\n      intro: \"Sin métricas, el proceso se gobierna por intuición. Con datos sabes dónde pierdes talento y cuánto cuesta cada semana de vacante abierta.\",\n      sections: [\"H\"]\n    }\n  ];\n\n  var SECTIONS = {\n    A: { title: \"Oferta real: lo que el candidato compra\", items: [\n      { t: \"Rango salarial definido y comunicable desde el primer contacto, sin «según valía».\", n: \"Si no puedes decirlo, el candidato lo interpretará como señal de alerta.\" },\n      { t: \"Proyecto concreto: qué se mejora, impacto esperado, fase actual y prioridades de los primeros 90 días.\", n: \"No «te incorporarás a un equipo dinámico». Contexto real con retos reales.\" },\n      { t: \"Tecnología, herramientas, entorno o contexto operativo explicados con especificidad.\" },\n      { t: \"Liderazgo definido: responsable directo, estilo de trabajo, ritmo y nivel de exigencia.\", n: \"El liderazgo es el principal motivo de fuga en los primeros 12 meses.\" },\n      { t: \"Flexibilidad real: días de teletrabajo, horario, reglas y excepciones reales, no la versión marketing.\" },\n      { t: \"Expectativas claras: resultados esperados, nivel de autonomía y criterios de éxito medibles.\" }\n    ]},\n    B: { title: \"Proceso de selección: velocidad + claridad\", items: [\n      { t: \"Fechas y etapas cerradas: número de fases, pruebas, quién participa y tiempos máximos entre etapas.\" },\n      { t: \"Decisor final identificado. No depende de un «lo tiene que ver dirección» indefinido.\", n: \"Si no sabes quién decide, el candidato tampoco lo sabrá. Eso transmite desorganización.\" },\n      { t: \"Feedback comprometido para todas las candidaturas avanzadas, también cuando es un no.\" },\n      { t: \"Tiempo total objetivo definido y defendible para no enfriar a candidatos que tienen alternativas.\" },\n      { t: \"Plan de reacción si aparece una candidatura muy alineada antes de lo previsto. ¿Puedes decidir en 48h?\" }\n    ]},\n    C: { title: \"Criterios de evaluación\", items: [\n      { t: \"Requisitos técnicos diferenciados: imprescindibles, deseables y formables.\", n: \"No todo puede ser imprescindible.\" },\n      { t: \"Competencias clave definidas: liderazgo, comunicación, autonomía, planificación o toma de decisiones según corresponda.\" },\n      { t: \"Expectativas del candidato previstas y contrastadas: salario, desarrollo, estabilidad, proyecto, flexibilidad y recorrido.\", n: \"Lo que no preguntas ahora, lo pagas después con una renuncia inesperada.\" },\n      { t: \"Encaje cultural traducido a comportamientos observables, no a «somos dinámicos y apasionados».\" },\n      { t: \"Valores críticos identificados y contrastables: los que, si no se comparten, generan fricción o salida temprana.\" },\n      { t: \"Pruebas, entrevistas o referencias alineadas con lo que realmente quieres validar, no con lo fácil de preguntar.\" }\n    ]},\n    D: { title: \"Entrevista y decisión\", items: [\n      { t: \"Las personas entrevistadoras saben qué evaluar, qué preguntas hacer y qué señales buscar.\" },\n      { t: \"Hay una matriz de decisión compartida para que no prime la primera impresión o la opinión más fuerte.\" },\n      { t: \"El área técnica y RRHH han alineado criterios antes de entrevistar.\", n: \"No descubren desacuerdos delante del candidato.\" },\n      { t: \"Se sabe qué concesiones son aceptables y cuáles son líneas rojas. Antes de ofertar, no después.\" }\n    ]},\n    E: { title: \"Liderazgo directo\", items: [\n      { t: \"Responsable directo identificado y disponible durante el proceso, no solo para la oferta final.\" },\n      { t: \"Estilo de liderazgo explicado con claridad y sin maquillaje. Ni «muy exigente» ni «muy buena persona». Específico.\" },\n      { t: \"Criterios de autonomía claros: qué puede decidir la persona sin pedir permiso desde el primer mes.\" },\n      { t: \"Prioridades reales del puesto ordenadas. No todo puede ser urgente e importante a la vez.\" },\n      { t: \"Posibles conflictos, tensiones o retos del área identificados antes de incorporar. Sin sorpresas en el día 30.\" }\n    ]},\n    F: { title: \"Cultura y coherencia\", items: [\n      { t: \"Los valores están traducidos a comportamientos observables. No son palabras en una web, son cosas que se hacen.\" },\n      { t: \"Hay coherencia entre lo que se promete en selección y lo que la persona vivirá realmente dentro.\" },\n      { t: \"La comunicación interna da contexto suficiente para que alguien nuevo entienda las decisiones.\" },\n      { t: \"Se han identificado posibles motivos de fuga en los primeros 3-6 meses y se tienen respuestas.\" }\n    ]},\n    G: { title: \"Onboarding que evita la fuga temprana\", items: [\n      { t: \"Plan 30/60/90 días con hitos medibles y primer quick win definido antes de la incorporación.\" },\n      { t: \"Buddy o mentor asignado antes del día 1, no improvisado en el primer café.\" },\n      { t: \"Todo listo el primer día: accesos, herramientas, objetivos y agenda inicial.\", n: \"El caos del primer día no se olvida.\" },\n      { t: \"Revisión estructurada en el día 15 y día 45 para validar encaje, detectar bloqueos y alinear expectativas.\" }\n    ]},\n    H: { title: \"Métricas que importan\", items: [\n      { t: \"Time-to-hire medido por tipo de puesto y área. ¿Cuánto tardáis realmente?\" },\n      { t: \"Tiempo desde la primera entrevista hasta la decisión final.\", n: \"Es donde más talento se pierde.\" },\n      { t: \"Acceptance rate: ofertas aceptadas frente a ofertas emitidas. Un ratio bajo alerta sobre la propuesta o el proceso.\" },\n      { t: \"Rotación 0–6 meses medida por causa, área y responsable. El dato más revelador sobre onboarding y liderazgo.\" },\n      { t: \"Coste mensual estimado de mantener la vacante abierta: productividad no generada, carga y riesgo operativo.\" },\n      { t: \"Motivos de rechazo de candidaturas buenas documentados. Si no lo sabes, repetirás el mismo error.\" }\n    ]}\n  };\n\n  var PRE_QUESTIONS = [\n    { id: \"pq1\", t: \"¿El perfil está activo en el mercado o habrá que salir a buscarlo de forma proactiva?\" },\n    { id: \"pq2\", t: \"¿La banda salarial que ofreces compite con lo que ese perfil recibe hoy en su empresa actual?\" },\n    { id: \"pq3\", t: \"¿El proyecto es suficientemente atractivo para que alguien que ya trabaja bien quiera moverse?\" },\n    { id: \"pq4\", t: \"¿Puedes explicar con claridad el impacto real del puesto, la autonomía y las prioridades de los primeros 90 días?\" },\n    { id: \"pq5\", t: \"¿El responsable técnico sabe evaluar competencias sin convertir la entrevista en un interrogatorio?\" },\n    { id: \"pq6\", t: \"¿Hay confidencialidad garantizada si la posición es sensible o supone reemplazar a alguien?\" },\n    { id: \"pq7\", t: \"¿El proceso permite decidir rápido si aparece una candidatura muy alineada antes de lo previsto?\" },\n    { id: \"pq8\", t: \"¿Se evaluará solo experiencia o también expectativas, cultura, valores y permanencia real?\" }\n  ];\n\n  var DECISIONS = [\n    { id: \"d1\", t: \"Activar búsqueda\" }, { id: \"d2\", t: \"Ajustar perfil / oferta\" }, { id: \"d3\", t: \"Revisar proceso interno\" },\n    { id: \"d4\", t: \"Pedir apoyo externo\" }, { id: \"d5\", t: \"Posponer hasta tener claridad\" }, { id: \"d6\", t: \"Convocar reunión de alineación\" }\n  ];\n\n  var HELP = [\n    { id: \"h1\", t: \"El perfil es técnico, escaso o difícil de encontrar en activo\" },\n    { id: \"h2\", t: \"Ya se intentó cubrir sin éxito o la posición es confidencial\" },\n    { id: \"h3\", t: \"El encaje cultural y de valores es crítico para la permanencia\" },\n    { id: \"h4\", t: \"El equipo no tiene tiempo o criterio de mercado suficiente\" }\n  ];\n\n  var ZONES = {\n    red:   { title: \"Rojo · Proceso en riesgo\", desc: \"Sin consenso. Perfil escaso. Ya se intentó cubrir sin éxito o la posición es crítica/confidencial. Estás improvisando el proceso.\", dec: \"No quemes la vacante. Pide apoyo externo o rediseña el proceso.\" },\n    amber: { title: \"Amarillo · Revisar antes\", desc: \"Hay base, pero el sistema pierde ritmo, claridad o atractivo. Dudas sobre salario, prioridades o decisores.\", dec: \"Ajusta perfil, oferta, decisores y tiempos antes de publicar.\" },\n    green: { title: \"Verde · Proceso preparado\", desc: \"Consenso interno. Perfil y oferta claros, banda salarial defendible, proceso ágil. Se evalúa experiencia, expectativas, valores y encaje.\", dec: \"Sal al mercado con proceso activo y seguimiento semanal.\" }\n  };\n  var ZCOLOR = { red: \"var(--st-red)\", amber: \"var(--st-amber)\", green: \"var(--st-green)\" };\n\n  var STORE = \"brandty-auditoria-v2\";\n  var TOTAL_ITEMS = 0;\n  Object.keys(SECTIONS).forEach(function (k) { TOTAL_ITEMS += SECTIONS[k].items.length; });\n  var MAX = TOTAL_ITEMS * 2;\n  var state = { scores: {}, checks: {}, notes: {} };\n\n  try {\n    var raw = localStorage.getItem(STORE);\n    if (raw) { var p = JSON.parse(raw); if (p && typeof p === \"object\") { state.scores = p.scores || {}; state.checks = p.checks || {}; state.notes = p.notes || {}; } }\n  } catch (e) {}\n  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }\n\n  function esc(s) { var d = document.createElement(\"div\"); d.textContent = s; return d.innerHTML; }\n\n  // ---- build checklist chapters ----\n  var root = document.getElementById(\"chapters\");\n  CHAPTERS.forEach(function (chap) {\n    var head = document.createElement(\"div\");\n    head.className = \"chapter\";\n    head.style.paddingTop = \"8px\";\n    head.innerHTML =\n      '<div class=\"pg\"><span class=\"k\">' + esc(chap.pg) + '<\u002Fspan><span class=\"n\">' + esc(chap.n) + '<\u002Fspan><\u002Fdiv>' +\n      '<h2 style=\"font-size:clamp(24px,2.6vw,32px);margin-bottom:14px\">' + esc(chap.title) + '<\u002Fh2>' +\n      (chap.intro ? '<p class=\"intro\" style=\"font-size:var(--text-body)\">' + esc(chap.intro) + '<\u002Fp>' : '');\n    root.appendChild(head);\n\n    chap.sections.forEach(function (sid) {\n      var sec = SECTIONS[sid];\n      var card = document.createElement(\"section\");\n      card.className = \"section\";\n      var hdr = document.createElement(\"header\");\n      hdr.innerHTML =\n        '<span class=\"ix\">' + sid + '<\u002Fspan>' +\n        '<div class=\"ttl\"><h3>' + esc(sec.title) + '<\u002Fh3><\u002Fdiv>' +\n        '<div class=\"sub\">Subtotal<b data-sub=\"' + sid + '\">0<\u002Fb><\u002Fdiv>';\n      card.appendChild(hdr);\n\n      sec.items.forEach(function (item, idx) {\n        var key = sid + idx;\n        var row = document.createElement(\"div\");\n        row.className = \"item\";\n        var txt = document.createElement(\"div\");\n        txt.className = \"txt\";\n        txt.innerHTML = '<p>' + esc(item.t) + '<\u002Fp>' + (item.n ? '<p class=\"note\">' + esc(item.n) + '<\u002Fp>' : '');\n        row.appendChild(txt);\n\n        var seg = document.createElement(\"div\");\n        seg.className = \"seg\";\n        seg.setAttribute(\"role\", \"group\");\n        [0, 1, 2].forEach(function (v) {\n          var b = document.createElement(\"button\");\n          b.type = \"button\";\n          b.textContent = v;\n          b.setAttribute(\"data-v\", v);\n          b.setAttribute(\"aria-label\", \"Puntuar \" + v);\n          b.setAttribute(\"aria-pressed\", state.scores[key] === v ? \"true\" : \"false\");\n          b.addEventListener(\"click\", function () {\n            if (state.scores[key] === v) delete state.scores[key]; else state.scores[key] = v;\n            seg.querySelectorAll(\"button\").forEach(function (btn) {\n              btn.setAttribute(\"aria-pressed\", state.scores[key] === Number(btn.getAttribute(\"data-v\")) ? \"true\" : \"false\");\n            });\n            save(); recompute();\n          });\n          seg.appendChild(b);\n        });\n        row.appendChild(seg);\n        card.appendChild(row);\n      });\n      root.appendChild(card);\n    });\n\n    // critical question / criterio\n    if (chap.crit || chap.criterio) {\n      var box = document.createElement(\"div\");\n      box.className = \"twocol\";\n      box.style.marginTop = \"4px\";\n      var html = \"\";\n      if (chap.crit) html += '<div class=\"callout callout--crit\"><p class=\"ck\">Pregunta crítica<\u002Fp><p>' + esc(chap.crit) + '<\u002Fp><\u002Fdiv>';\n      if (chap.criterio) html += '<div class=\"callout callout--criterio\"><p class=\"ck\">Criterio Brandty<\u002Fp><p>' + esc(chap.criterio) + '<\u002Fp><\u002Fdiv>';\n      box.innerHTML = html;\n      root.appendChild(box);\n    }\n    // capture textarea\n    if (chap.capture) {\n      var cap = document.createElement(\"div\");\n      cap.className = \"capture\";\n      cap.style.marginTop = \"20px\";\n      cap.innerHTML = '<label for=\"cap_' + chap.capture.key + '\">' + esc(chap.capture.label) + '<\u002Flabel>' +\n        '<textarea id=\"cap_' + chap.capture.key + '\" data-note=\"' + chap.capture.key + '\" placeholder=\"' + esc(chap.capture.ph) + '\"><\u002Ftextarea>';\n      root.appendChild(cap);\n    }\n  });\n\n  // ---- render checklists (pre-questions, decisions, help) ----\n  function renderChecks(containerId, list) {\n    var c = document.getElementById(containerId);\n    list.forEach(function (q) {\n      var b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.className = \"check\";\n      b.setAttribute(\"data-ck\", q.id);\n      b.setAttribute(\"aria-pressed\", state.checks[q.id] ? \"true\" : \"false\");\n      b.innerHTML = '<span class=\"box\" aria-hidden=\"true\"><\u002Fspan><span class=\"ct\">' + esc(q.t) + '<\u002Fspan>';\n      b.addEventListener(\"click\", function () {\n        state.checks[q.id] = !state.checks[q.id];\n        b.setAttribute(\"aria-pressed\", state.checks[q.id] ? \"true\" : \"false\");\n        save();\n      });\n      c.appendChild(b);\n    });\n  }\n  renderChecks(\"prequestions\", PRE_QUESTIONS);\n  renderChecks(\"decisions\", DECISIONS);\n  renderChecks(\"help\", HELP);\n\n  // ---- bind notes (text inputs + textareas) ----\n  document.querySelectorAll(\"[data-note]\").forEach(function (el) {\n    var k = el.getAttribute(\"data-note\");\n    if (state.notes[k] != null) el.value = state.notes[k];\n    el.addEventListener(\"input\", function () { state.notes[k] = el.value; save(); });\n  });\n\n  // ---- compute ----\n  var elScore = document.getElementById(\"r_score\");\n  var elAnswered = document.getElementById(\"r_answered\");\n  var elFill = document.getElementById(\"r_fill\");\n  var elVTitle = document.getElementById(\"v_title\");\n  var elVDesc = document.getElementById(\"v_desc\");\n  var elVDec = document.getElementById(\"v_dec\");\n  var lamps = document.querySelectorAll(\".lamp\");\n  var diagCards = document.querySelectorAll(\".diag-card\");\n  var mbScore = document.getElementById(\"mb_score\");\n  var mbZone = document.getElementById(\"mb_zone\");\n  var mbDot = document.getElementById(\"mb_dot\");\n\n  function zoneFor(s) { return s <= 33 ? \"red\" : s <= 57 ? \"amber\" : \"green\"; }\n\n  function recompute() {\n    var total = 0, answered = 0, subs = {};\n    Object.keys(SECTIONS).forEach(function (k) { subs[k] = 0; });\n    Object.keys(state.scores).forEach(function (key) {\n      var v = state.scores[key];\n      if (v === 0 || v === 1 || v === 2) { total += v; answered++; var sid = key.charAt(0); if (subs[sid] != null) subs[sid] += v; }\n    });\n    Object.keys(SECTIONS).forEach(function (k) {\n      var el = document.querySelector('[data-sub=\"' + k + '\"]');\n      if (el) el.textContent = subs[k] + \" / \" + (SECTIONS[k].items.length * 2);\n    });\n\n    elScore.textContent = total;\n    elAnswered.textContent = answered + \" de \" + TOTAL_ITEMS + \" elementos puntuados\";\n    elFill.style.width = (total / MAX * 100) + \"%\";\n    var z = zoneFor(total);\n    elFill.style.background = ZCOLOR[z];\n    mbScore.textContent = total;\n    mbDot.style.background = ZCOLOR[z];\n    mbDot.style.color = ZCOLOR[z];\n\n    if (answered === 0) {\n      lamps.forEach(function (l) { l.classList.remove(\"on\"); });\n      diagCards.forEach(function (d) { d.classList.remove(\"on\"); });\n      elVTitle.textContent = \"Aún sin puntuar\";\n      elVDesc.textContent = \"Marca los elementos para ver tu diagnóstico y la decisión recomendada.\";\n      elVDec.textContent = \"—\";\n      mbZone.textContent = \"Sin puntuar\";\n      return;\n    }\n    lamps.forEach(function (l) { l.classList.toggle(\"on\", l.getAttribute(\"data-zone\") === z); });\n    diagCards.forEach(function (d) { d.classList.toggle(\"on\", d.getAttribute(\"data-zone\") === z); });\n    var info = ZONES[z];\n    elVTitle.textContent = info.title;\n    elVDesc.textContent = info.desc;\n    elVDec.textContent = info.dec;\n    mbZone.textContent = z === \"red\" ? \"Rojo · en riesgo\" : z === \"amber\" ? \"Amarillo · revisar\" : \"Verde · preparado\";\n  }\n\n  document.getElementById(\"btnPrint\").addEventListener(\"click\", function () { window.print(); });\n  document.getElementById(\"btnReset\").addEventListener(\"click\", function () {\n    if (!confirm(\"¿Reiniciar toda la auditoría? Se borrarán las puntuaciones, las notas y los datos introducidos.\")) return;\n    state = { scores: {}, checks: {}, notes: {} };\n    save();\n    document.querySelectorAll(\".seg button\").forEach(function (b) { b.setAttribute(\"aria-pressed\", \"false\"); });\n    document.querySelectorAll(\".check\").forEach(function (b) { b.setAttribute(\"aria-pressed\", \"false\"); });\n    document.querySelectorAll(\"[data-note]\").forEach(function (el) { el.value = \"\"; });\n    recompute();\n  });\n\n  recompute();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

<button id="brandty-save" onclick="brandtySave()">Guardar mi resultado en PDF</button>
<div id="brandty-hint">En el cuadro de impresion elige <b>Guardar como PDF</b> como destino.</div>
<script>
function brandtySave(){
  var h=document.getElementById('brandty-hint');
  if(h){h.style.display='block';setTimeout(function(){h.style.display='none'},6000);}
  setTimeout(function(){window.print();},400);
}
</script>
